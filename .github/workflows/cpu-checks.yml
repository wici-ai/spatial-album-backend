name: Backend CPU contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.2.0
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q backend
